kind = "web"
previewPath = "/"
title = "UL AI Assistant"
version = "1.0.0"
id = "artifacts/ul-ai-assistant"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22683

[services.development]
run = "pnpm --filter @workspace/ul-ai-assistant run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ul-ai-assistant", "run", "build" ]
publicDir = "artifacts/ul-ai-assistant/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22683"
BASE_PATH = "/"
